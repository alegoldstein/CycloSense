[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

board_build.filesystem = spiffs
board_build.partitions = partitions.csv

lib_deps =
    bodmer/TFT_eSPI
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    -DUSER_SETUP_LOADED
    -DILI9341_DRIVER
    -DTFT_MISO=-1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DSPI_FREQUENCY=40000000
    -DTOUCH_CS=-1
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DEI_PORTING_ARDUINO=1
    -lm